name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Package verified binary
        run: |
          target/x86_64-unknown-linux-musl/release/aaqe --version
          tar -czf aaqe-x86_64-unknown-linux-musl.tar.gz \
            -C target/x86_64-unknown-linux-musl/release aaqe
          sha256sum aaqe-x86_64-unknown-linux-musl.tar.gz \
            > aaqe-x86_64-unknown-linux-musl.tar.gz.sha256

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            aaqe-x86_64-unknown-linux-musl.tar.gz
            aaqe-x86_64-unknown-linux-musl.tar.gz.sha256
