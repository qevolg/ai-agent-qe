[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-qe"
version = "0.1.0"
description = "Prompt-driven quality engineering with Codex and retained Docker environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.21,<5",
  "tree-sitter>=0.23,<0.26",
  "tree-sitter-rust>=0.23,<0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.9,<1"]

[project.scripts]
aaqe = "aaqe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aaqe = ["resources/skills/*/SKILL.md", "resources/agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
