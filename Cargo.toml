[package]
name = "ai-agent-qe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Prompt-driven quality engineering with Codex and retained Docker environments"
readme = "README.md"
license = "MIT"
repository = "https://github.com/qevolg/ai-agent-qe"
default-run = "aaqe"
include = [
  "/Cargo.toml", "/Cargo.lock", "/README*.md", "/LICENSE", "/aaqe.yaml.example",
  "/install.sh", "/docs/configuration.md",
  "/src/**/*.rs", "/resources/**/*.md", "/resources/**/*.json", "/tests/**/*.rs",
]

[lib]
name = "aaqe"
path = "src/lib.rs"

[[bin]]
name = "aaqe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
shell-escape = "0.1"
signal-hook = "0.3"
uuid = { version = "1", features = ["v4"] }

[[example]]
name = "aaqe-test-worker"
path = "tests/support/worker.rs"
test = true
harness = false

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
